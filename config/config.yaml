# References

workdir:
    WORKDIR
scriptsdir:
    PIPELINE_HOME/workflow/scripts/
manifest:
    WORKDIR/config/samples.tsv
tools:
    PIPELINE_HOME/resources/tools.yaml
cluster:
    PIPELINE_HOME/resources/cluster.yaml

primers: 
    PIPELINE_HOME/resources/primers.fasta

# Reference by genome annotation version
gencode_version: v28

v28:
    ref:
        /vf/users/khanlab3/gb_omics/resources/genomes/gencode_human_28/GRCh38.primary_assembly.genome.fa
    gtf:
        /vf/users/khanlab3/gb_omics/resources/gencode/gencode.v28.annotation.gtf

# Custom fusion reference
fusion_genome: [ewsr1_fli1, ewsr1_erg]

ewsr1_fli1:
    fusion_ref:
        PIPELINE_HOME/resources/fusion_genome/ewsr1_fli1.fa
ewsr1_erg:
    fusion_ref:
        PIPELINE_HOME/resources/fusion_genome/ewsr1_erg.fa

# Genes of interest
genes_of_interest: [EWSR1, FLI1]
EWSR1: 
    id: "ENSG00000182944.17"
FLI1: 
    id: "ENSG00000151702.16"
CD99: 
    id: "ENSG00000002586.19"
PURPL: 
    id: "ENSG00000250337.5"

# Tools
gffread: 
    /data/khanlab3/gb_omics/software/gffread/gffread