# Cluster resources per rule
__default__:
    gres: lscratch:96
    mem: 4g
    threads: 2
    time: 00-00:30:00
    partition: norm
    name: "{rule}.{wildcards}"
    output: "logs/{rule}.${{SLURM_JOBID}}.%j.{wildcards}.out"
    error: "logs/{rule}.${{SLURM_JOBID}}.%j.{wildcards}.err"

cluster:
    mem: 200g
    threads: 24
    time: 00-08:00:00
    gres: lscratch:500

collapse:
    mem: 96g
    threads: 24

pigeon:
    mem: 8g
    threads: 4

pull_genes:
    threads: 24
    mem: 24g
